<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-12">ユーザー一覧</h1>
    <div class="bg-blue-200 rounded-lg w-full p-6 text-between-center text-2xl hover-red text-black">Git<span class="text-amber-600 text-2xl ">Hub</span></div>
    
        <div id="userList" class="grid gap-4"></div>

    <script>
        async function loadUsers() {
            const userList = document.getElementById("userList");

            try {
                const response = await fetch ("https://api.github.com/users");
                if (!response.ok) {
                    throw new Error("通信エラー:" + response.status);
                    //ここから下は絶対に実行されない
                    console.log("ここは実行されない")
                }

                const users = await response.json();
                console.log(users);
                
                //ここからカード作り

                userList.textContent = "";
                users.forEach((user) => {
                    const card = document.createElement("div");
                    card.className = "w-auto h-30 bg-blue-600 p-3 rounded-lg shadow p-4 hover underline"

                    const  avatar = document.createElement("img");
                    avatar.src = user.avatar_url;
                    avatar.className = "w-16 h-12 rounded-full"
                    
                    const name = document.createElement("h2");
                    name.className = "text-lg text-black font-bold";
                    name.textContent = user.name;

                    const bio = document.createElement("h3")
                    bio.className = "text-lg font-bold";
                    bio.textContent = user.login;
    

                    const email = document.createElement("p");
                    email.className = "text-gray-600 text-sm ";
                    email.textContent = user.email;

                    const followers = document.createElement("p")
                    followers.className = "text-gray-600 text-normal"
                    followers.textContent = "フォロワー数：" + user.followers;
                    
                    card.appendChild(followers);
                    card.appendChild(avatar);
                    card.appendChild(bio);
                    card.appendChild(name);
                    card.appendChild(email);
                    userList.appendChild(card);
                });
            } catch (error) {
                userList.textContent = "データの取得に失敗しました";
                console.error(error);


            }


        }
        loadUsers();
    </script>
</body>
</html>
